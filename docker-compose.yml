services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      - mysql

